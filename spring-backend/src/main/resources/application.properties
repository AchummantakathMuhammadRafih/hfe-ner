server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
gliner.service.url=http://127.0.0.1:8000

# ===================================================================
# SQLite Database Configuration (Persistent State + WAL Mode)
# ===================================================================
spring.datasource.url=jdbc:sqlite:hfe_batch.db?journal_mode=WAL&busy_timeout=30000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===================================================================
# Default Entity & Relation Labels (Comma-separated)
# ===================================================================
gliner.default.entity-labels=USER_GROUP,USE_ENVIRONMENT,USE_SCENARIO,USE_SPECIFICATION,CLINICAL_WORKFLOW,COGNITIVE_LOAD,SITUATIONAL_AWARENESS,TRAINING,PERSON,MEDICAL_DEVICE,USER_INTERFACE,UI_COMPONENT,INSTRUCTIONS_FOR_USE,PACKAGING,PERSONAL_PROTECTIVE_EQUIPMENT,USER_TASK,CRITICAL_TASK,TASK_ANALYSIS,HAZARD,HAZARDOUS_SITUATION,HARM,RISK,RISK_CONTROL_MEASURE,USE_ERROR,ABNORMAL_USE,CLOSE_CALL,USE_DIFFICULTY,CONTRIBUTING_FACTOR,ROOT_CAUSE_ANALYSIS,USE_SAFETY,CONTRAINDICATION,USABILITY_TEST,EVALUATION,EVALUATION_METHOD,TEST_PROTOCOL,TEST_OBSERVATION,USABILITY_FINDING,USABILITY_ATTRIBUTE,EVALUATION_DATA,HFE_PROCESS,DESIGN_PRINCIPLE,USER_NEED,REQUIREMENT,REGULATORY_GUIDANCE,ORGANIZATION,REGULATORY_SUBMISSION,POST_MARKET_SURVEILLANCE,POST_MARKET_EVENT
gliner.default.relation-labels=IS_A,HAS_PART,HAS_PROPERTY,MANIFESTS_AS,CAUSES,CONTRIBUTES_TO,ASSOCIATED_WITH,EXPOSES_TO,PREVENTS,MITIGATES,CONTROLS_RISK,INTERACTS_WITH,PERCEIVES,MISINTERPRETS,PERFORMS,USES,OPERATES,EVALUATES,OBSERVED_DURING,IDENTIFIES,VERIFIES,VALIDATES,SIMULATES,CONDUCTED_BY,REQUIRES,CONFORMS_TO,SATISFIES,REGULATED_BY,DOCUMENTED_IN,DERIVED_FROM
gliner.default.threshold=0.35
gliner.default.relation-threshold=0.28
gliner.chunk.batch-size=8

